[project]
name = "changeguard"
version = "0.1.0"
description = "P6 ChangeGuard: Change-Risk Investigator and Release Gate (Acme Retail Ltd, synthetic data)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "tenacity>=8.4",
  "pyyaml>=6.0",
  "python-multipart>=0.0.18",  # required by FastAPI Form handling (CAB one-page UI)
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.11",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/changeguard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/changeguard/api.py" = ["E501", "B008"]
"scripts/*.py" = ["E501"]
"tests/*" = ["E501", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv]
package = true
